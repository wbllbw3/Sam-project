<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gacha Simulator — Sam's Project</title>
<style>
  :root {
    --bg: #0a0d13;
    --panel: #131a24;
    --panel-2: #18202c;
    --line: #243143;
    --line-soft: #1b2431;
    --text: #e9eef6;
    --muted: #8b98ac;
    --gray: #9aa6b8;
    --blue: #5aa9ff;
    --gold: #f3c969;
    --danger: #ff6b6b;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    color: var(--text);
    font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 520px at 12% -8%, #1b2b45 0%, transparent 58%),
      radial-gradient(760px 420px at 96% -4%, #2b2415 0%, transparent 55%),
      var(--bg);
    background-attachment: fixed;
    min-height: 100vh;
    padding: 22px 20px 40px;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1180px; margin: 0 auto; }

  /* ---------------------------------------------------------------- header */
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 38px; height: 38px; flex: none; border-radius: 11px;
    background: linear-gradient(145deg, #2a3a52, #17202c);
    border: 1px solid #35465c; display: grid; place-items: center;
    box-shadow: 0 6px 18px -10px #000;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.2px; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
  .lang-switch { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 4px; flex: none; }
  .lang-switch button {
    border: 0; background: transparent; color: var(--muted); padding: 6px 13px; white-space: nowrap;
    border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600;
  }
  .lang-switch button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: 0 1px 0 #2e3d52 inset; }

  /* ---------------------------------------------------------------- layout */
  .layout { display: grid; grid-template-columns: 336px minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .side { position: static; } }
  @media (max-width: 620px) {
    body { padding: 14px 12px 32px; }
    header.top { flex-wrap: wrap; row-gap: 10px; }
    h1 { font-size: 18px; }
    .bank .big span.num { font-size: 36px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 9px; }
  }
  .side { display: grid; gap: 14px; position: sticky; top: 16px; }
  .main { display: grid; gap: 14px; min-width: 0; }

  .panel {
    background: linear-gradient(180deg, #151d28, #111823);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: 0 20px 40px -34px #000, 0 1px 0 #1e2836 inset;
  }
  .panel h2 {
    font-size: 12px; margin: 0 0 12px; color: var(--muted);
    font-weight: 700; letter-spacing: .9px; text-transform: uppercase;
  }
  .k { font-size: 12px; color: var(--muted); letter-spacing: .3px; }
  .fine { margin: 10px 0 0; font-size: 12px; color: #74839a; line-height: 1.5; }

  /* ------------------------------------------------------------- bank/pity */
  .bank .big { display: flex; align-items: baseline; gap: 7px; margin-top: 2px; }
  .bank .big span.num {
    font-size: 42px; font-weight: 700; letter-spacing: -1.6px; line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .bank .big span.unit { font-size: 13px; color: var(--muted); }
  .meter { height: 6px; border-radius: 99px; background: #0c1118; overflow: hidden; margin-top: 10px; border: 1px solid #1c2532; }
  .meter i { display: block; height: 100%; border-radius: 99px; transition: width .35s ease; }
  .meter i.gold { background: linear-gradient(90deg, #c99a3c, var(--gold)); }
  .meter i.blue { background: linear-gradient(90deg, #2f6bb5, var(--blue)); }

  .pity .pity-line { display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px; }
  .pity .pity-line .n { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pity .pity-line .n small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .rate-now { text-align: right; }
  .rate-now .v { font-size: 20px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
  .rate-now .k { font-size: 11px; }

  /* ---------------------------------------------------------------- buttons */
  .actions { display: grid; gap: 10px; }
  button.btn {
    border: 1px solid #33455c; color: var(--text); border-radius: 12px;
    padding: 0 16px; cursor: pointer; font-size: 14px; font-weight: 650;
    background: linear-gradient(180deg, #22303f, #1a2430);
    transition: transform .09s ease, border-color .16s, box-shadow .16s, filter .16s;
    font-family: inherit;
  }
  button.btn:hover:not(:disabled) { border-color: #4d6a8a; }
  button.btn:active:not(:disabled) { transform: translateY(1px); }
  button.btn:disabled { opacity: .4; cursor: not-allowed; filter: grayscale(.4); }
  .pull-one, .pull-ten { height: 54px; display: flex; align-items: center; justify-content: space-between; }
  button.btn.pull-one { background: linear-gradient(180deg, #2a3d54, #1c2837); border-color: #3b5471; }
  button.btn.pull-ten {
    background: linear-gradient(135deg, #f8d98c, #d9a53f 55%, #c08f2c);
    color: #2a1f04; border-color: #ffe3a3;
    box-shadow: 0 12px 28px -16px #f3c969, 0 1px 0 #ffe9b0 inset;
  }
  button.btn.pull-ten .cost { color: #5a4310; opacity: .85; }
  .btn .cost { font-size: 11.5px; font-weight: 600; opacity: .72; letter-spacing: .4px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row2 button { height: 38px; font-size: 12.5px; }
  button.ghost { background: transparent; border-color: #2b3a4d; color: #a9b7ca; }
  button.danger { background: transparent; border-color: #4a2c2c; color: #d98b8b; }

  .hint { margin: 2px 0 0; font-size: 12px; color: #74839a; line-height: 1.5; min-height: 18px; }
  .hint.warn { color: var(--danger); }

  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .totals .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }

  /* ----------------------------------------------------------------- stage */
  .stage { min-height: 292px; display: flex; flex-direction: column; }
  .stage-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .stage-head h2 { margin: 0; }
  .stage-head .meta { font-size: 12px; color: var(--muted); }
  .stage-head .meta b { color: var(--text); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 12px; }
  .grid.single { grid-template-columns: minmax(0, 168px); }
  .stage.compact { min-height: 0; }
  .card { position: relative; border-radius: 13px; padding: 1px; }
  .card .inner {
    position: relative; overflow: hidden; border-radius: 12px;
    background: linear-gradient(175deg, #1a2331, #141b26);
    border: 1px solid #2b3a4d; padding: 12px 8px 10px; text-align: center;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s;
  }
  .card:hover .inner { transform: translateY(-4px); }
  .card .art { width: 100%; height: 86px; display: block; }
  .card .art svg { width: 100%; height: 100%; display: block; }
  .card .name { font-size: 12px; margin-top: 6px; color: #cfdaea; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .rar {
    position: absolute; top: 7px; left: 7px; z-index: 2;
    font-size: 9.5px; font-weight: 800; letter-spacing: .8px;
    padding: 2px 6px; border-radius: 5px;
  }
  .card.R .inner { border-color: #2f3b4c; }
  .card.R .rar { background: #2b3543; color: #b7c3d4; }
  .card.SR .inner { border-color: #2c5f9e; box-shadow: 0 0 26px -18px var(--blue); }
  .card.SR .rar { background: #1d3a5e; color: #a9d2ff; }
  .card.SR:hover .inner { box-shadow: 0 10px 30px -18px var(--blue), 0 0 0 1px #3d7cc4 inset; }
  .card.SSR .inner { border-color: #6b5518; }
  .card.SSR .rar { background: var(--gold); color: #2a1f04; }
  .card.SSR .inner::after {
    content: ""; position: absolute; inset: -55%; z-index: 0;
    background: conic-gradient(from 0deg, transparent 0deg, #f3c96955 40deg, transparent 120deg, #5aa9ff33 200deg, transparent 300deg);
    animation: spin 7s linear infinite;
  }
  .card.SSR .art, .card.SSR .name { position: relative; z-index: 1; }
  .card.SSR:hover .inner { box-shadow: 0 12px 34px -16px #f3c969; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card { animation: pop .34s cubic-bezier(.2, .9, .3, 1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.94); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .card, .card.SSR .inner::after { animation: none; }
  }

  .stage-empty { flex: 1; display: grid; place-items: center; gap: 14px; padding: 26px 0 10px; }
  .ghost-row { display: flex; gap: 10px; }
  .ghost-card {
    width: 54px; height: 76px; border-radius: 9px;
    border: 1px dashed #2b3949; background: linear-gradient(180deg, #151d27, #111822);
    display: grid; place-items: center; opacity: .8;
  }
  .ghost-card span { width: 14px; height: 14px; border: 1px solid #33475e; transform: rotate(45deg); border-radius: 2px; }
  .empty { color: var(--muted); font-size: 13px; margin: 0; }

  /* ----------------------------------------------------------------- rates */
  .rate-list { display: grid; gap: 14px; }
  .rate-item .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .rate-item .top .pct { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rate-item .top .each { font-size: 11.5px; color: #74839a; margin-left: auto; }
  .bar { height: 8px; border-radius: 99px; background: #0c1118; border: 1px solid #1c2532; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; }
  .bar i.R { background: linear-gradient(90deg, #4b5a6d, #6f7f94); }
  .bar i.SR { background: linear-gradient(90deg, #2b6bb5, #5aa9ff); }
  .bar i.SSR { background: linear-gradient(90deg, #a97f22, #f3c969); min-width: 7px; }
  .rate-names { font-size: 11.5px; color: #74839a; margin-top: 6px; line-height: 1.45; }
  .chip {
    font-size: 10px; font-weight: 800; letter-spacing: .7px; padding: 2px 7px; border-radius: 5px;
  }
  .chip.R { background: #2b3543; color: #b7c3d4; }
  .chip.SR { background: #1d3a5e; color: #a9d2ff; }
  .chip.SSR { background: var(--gold); color: #2a1f04; }

  /* --------------------------------------------------------------- history */
  .hist { max-height: 300px; overflow: auto; border-radius: 10px; }
  .hist::-webkit-scrollbar { width: 8px; }
  .hist::-webkit-scrollbar-thumb { background: #24303f; border-radius: 99px; }
  .hist-row {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; font-size: 12.5px;
    border-bottom: 1px solid var(--line-soft); border-left: 2px solid transparent;
    font-variant-numeric: tabular-nums;
  }
  .hist-row:last-child { border-bottom: 0; }
  .hist-row.SR { border-left-color: var(--blue); }
  .hist-row.SSR { border-left-color: var(--gold); }
  .hist-row .idx { color: #66748a; width: 56px; flex: none; }
  .hist-row .nm { flex: 1; color: #c8d4e4; }
  .hist-row .tm { color: #5d6b80; font-size: 11.5px; }

  /* ------------------------------------------------------------------ help */
  .help-wrap { padding: 0; }
  details.help summary {
    cursor: pointer; padding: 14px 18px; font-weight: 650; font-size: 13.5px; list-style: none;
    display: flex; align-items: center; gap: 8px; color: #c3cddb;
  }
  details.help summary::-webkit-details-marker { display: none; }
  details.help summary::before { content: "?"; font-size: 11px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: #22303f; color: #9fb0c5; }
  details.help .body { color: #b6c2d2; font-size: 13.5px; padding: 0 18px 16px 44px; }
  details.help .body p { margin: 8px 0; }
  details.help ol { margin: 8px 0; padding-left: 20px; }
  details.help li { margin: 5px 0; }
  details.help strong { color: var(--text); }

  footer { color: #55637a; font-size: 11.5px; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 2 L21 12 L12 22 L3 12 Z" stroke="#f3c969" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M12 7 L17 12 L12 17 L7 12 Z" fill="#f3c969" opacity=".35"/>
        </svg>
      </div>
      <div>
        <h1 id="appTitle">Gacha Simulator</h1>
        <p class="sub" id="appSub"></p>
      </div>
    </div>
    <div class="lang-switch" role="group" aria-label="Language">
      <button id="langEn" type="button">EN</button>
      <button id="langZh" type="button">中文</button>
    </div>
  </header>

  <main class="layout">
    <aside class="side">
      <div class="panel bank">
        <div class="k" id="lblPullsLeft"></div>
        <div class="big"><span class="num" id="pullsLeft">1000</span><span class="unit" id="unitPulls"></span></div>
        <div class="meter"><i class="gold" id="meterFill" style="width:100%"></i></div>
      </div>

      <div class="panel pity">
        <div class="k" id="lblPity"></div>
        <div class="pity-line">
          <span class="n" id="pityCount">0 <small>/ 65</small></span>
          <span class="rate-now"><span class="k" id="lblRate"></span><br><span class="v" id="ssrRate">2%</span></span>
        </div>
        <div class="meter"><i class="blue" id="pityFill" style="width:0%"></i></div>
      </div>

      <div class="panel actions">
        <button class="btn pull-one" id="pull1" type="button">
          <span class="t"></span><span class="cost">1</span>
        </button>
        <button class="btn pull-ten" id="pull10" type="button">
          <span class="t"></span><span class="cost">10</span>
        </button>
        <div class="row2">
          <button class="btn ghost" id="sim" type="button"></button>
          <button class="btn danger" id="reset" type="button"></button>
        </div>
        <p class="hint" id="hint"></p>
      </div>

      <div class="panel totals">
        <div class="stat"><div class="k" id="lblTotal"></div><div class="v" id="totalPulls">0</div></div>
        <div class="stat"><div class="k" id="lblSsrCount"></div><div class="v" id="ssrCount">0</div></div>
      </div>
    </aside>

    <section class="main">
      <div class="panel stage">
        <div class="stage-head">
          <h2 id="resultTitle"></h2>
          <span class="meta" id="resultMeta"></span>
        </div>
        <div id="results" aria-live="polite"></div>
      </div>

      <div class="panel">
        <h2 id="ratesTitle"></h2>
        <div class="rate-list" id="ratesBody"></div>
        <p class="fine" id="ratesNote"></p>
      </div>

      <div class="panel">
        <h2 id="historyTitle"></h2>
        <div class="hist" id="history"></div>
      </div>

      <div class="panel help-wrap">
        <details class="help" id="help">
          <summary id="helpSummary"></summary>
          <div class="body" id="helpBody"></div>
        </details>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>
</div>

<script>

      metaOne: "1 张",
      historyTitle: "历史记录（最近 200 条）",
      emptyStage: "还没有抽过卡，卡池在等你。",
      emptyHistory: "暂无记录。",
      hintReady: "初始 1000 抽。单抽消耗 1，十连消耗 10。",
      hintNoPulls: "抽数不足，点“重置”重新开始。",
      hintPity: "保底：连续 40 抽无 SSR 后每抽 +4 个百分点，第 65 抽必出。",
      hintSim: "10000 抽模拟 → R {r}%，SR {sr}%，SSR {ssr}%（平均 {avg} 抽一个 SSR）。不消耗抽数。",
      confirmReset: "确定重置？抽数、历史记录和保底计数都会清空。",
      helpSummary: "使用说明",
      help: [
        "<p>消耗抽数抽卡。每张卡是一个点、一个平面图形或一个立体图形，类别越稀有，卡越少、越难抽。</p>",
        "<ol>",
        "<li><strong>单抽</strong>：消耗 1 抽。</li>",
        "<li><strong>十连</strong>：消耗 10 抽，必出至少一个 SR 或 SSR。</li>",
        "<li><strong>模拟 10000 次</strong>：统计概率，不消耗抽数。</li>",
        "<li><strong>重置</strong>：清空抽数、历史和保底计数。</li>",
        "</ol>",
        "<p>进度保存在浏览器本地（localStorage），刷新后仍在，不会上传。</p>",
        "<p>保底：前 40 抽固定 2%；第 41 抽起每抽 +4 个百分点，第 65 抽必出。当前概率实时显示在左侧。</p>"
      ],
      footer: "第 05 次课 · 抽卡模拟器 · 单文件、无网络依赖。"
    }
  };

  /* --------------------------------------------------------------- state */

  var state = null;

  function defaultState() {
    return {
      v: 1, left: START_PULLS, used: 0, counter: 0,
      stats: { R: 0, SR: 0, SSR: 0 }, history: [], lang: "en"
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var s = JSON.parse(raw), d = defaultState();
      if (typeof s.left !== "number") s.left = d.left;
      if (typeof s.used !== "number") s.used = d.used;
      if (typeof s.counter !== "number") s.counter = d.counter;
      if (!s.stats) s.stats = d.stats;
      if (!Array.isArray(s.history)) s.history = [];
      if (s.lang !== "zh" && s.lang !== "en") s.lang = "en";
      return s;
    } catch (e) { return defaultState(); }
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* private mode */ }
  }

  /* ------------------------------------------------------------ gacha math */

  function ssrRate(counter) {
    var n = counter + 1;
    if (n <= PITY_START) return BASE_SSR;
    return Math.min(1, BASE_SSR + PITY_STEP * (n - PITY_START));
  }

  function roll(rng, counter) {
    var pSsr = ssrRate(counter);
    if (rng() < pSsr) return { rarity: "SSR", counter: 0 };
    var rest = 1 - pSsr;
    var pSr = rest * (AND_RATE / (1 - BASE_SSR));
    if (rng() < pSr) return { rarity: "SR", counter: counter + 1 };
    return { rarity: "R", counter: counter + 1 };
  }

  function pool(rarity) {
    var out = [];
    for (var i = 0; i < CARDS.length; i++) if (CARDS[i].rarity === rarity) out.push(CARDS[i]);
    return out;
  }

  function pickCard(rarity, rng) {
    var p = pool(rarity);
    return p[Math.floor(rng() * p.length) % p.length];
  }

  function rngDefault() { return Math.random(); }

  /* ------------------------------------------------------------- drawing */

  function doPull(rng) {
    var res = roll(rng, state.counter);
    state.counter = res.counter;
    return pickCard(res.rarity, rng);
  }

  function doPullTen(rng) {
    var out = [], gotHigh = false;
    for (var i = 0; i < 9; i++) {
      var c = doPull(rng);
      if (c.rarity !== "R") gotHigh = true;
      out.push(c);
    }
    if (gotHigh) {
      out.push(doPull(rng));
    } else {
      var pSsr = ssrRate(state.counter);
      if (rng() < pSsr) {
        state.counter = 0;
        out.push(pickCard("SSR", rng));
      } else {
        state.counter = state.counter + 1;
        out.push(pickCard("SR", rng));
      }
    }
    return out;
  }

  function commit(cards) {
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      state.stats[c.rarity] = (state.stats[c.rarity] || 0) + 1;
      state.used += 1;
      state.history.unshift({ id: c.id, rarity: c.rarity, n: state.used, t: Date.now() });
    }
    if (state.history.length > HISTORY_MAX) state.history.length = HISTORY_MAX;
    save();
  }

  /* ------------------------------------------------------------- svg art */

  var COLORS = {
    R:   { line: "#c3cede", fill: "#4d5b6e", hi: "#7d8ca3" },
    SR:  { line: "#5aa9ff", fill: "#1d3557", hi: "#7fc0ff" },
    SSR: { line: "#f3c969", fill: "#4a3a10", hi: "#ffe9a8" }
  };

  function svgWrap(inner) {
    return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + inner + "</svg>";
  }

  function starPath(cx, cy, outer, inner, c) {
    var pts = [];
    for (var i = 0; i < 10; i++) {
      var r = i % 2 ? inner : outer;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      pts.push((cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1));
    }
    return '<polygon points="' + pts.join(" ") + '" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="2.5" stroke-linejoin="round"/>';
  }

  function polygon(cx, cy, r, sides, startDeg, c) {
    var pts = [];
    for (var i = 0; i < sides; i++) {
      var a = (startDeg + i * 360 / sides) * Math.PI / 180;
      pts.push((cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1));
    }
    return '<polygon points="' + pts.join(" ") + '" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="3" stroke-linejoin="round"/>';
  }

  function dotShape(v, c) {
    switch (v) {
      case "square": return '<rect x="20" y="20" width="24" height="24" rx="4" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="2.5"/>';
      case "triangle": return '<path d="M32 16 L48 46 L16 46 Z" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="2.5" stroke-linejoin="round"/>';
      case "diamond": return '<path d="M32 14 L48 32 L32 50 L16 32 Z" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="2.5" stroke-linejoin="round"/>';
      case "cross": return '<path d="M27 14 h10 v13 h13 v10 h-13 v13 h-10 v-13 h-13 v-10 h13 z" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="2.5" stroke-linejoin="round"/>';
      case "star": return starPath(32, 32, 18, 8, c);
      default: return '<circle cx="32" cy="32" r="13" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="2.5"/>';
    }
  }

  function flatShape(v, c) {
    switch (v) {
      case "triangle": return '<path d="M32 12 L53 50 L11 50 Z" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="3" stroke-linejoin="round"/>';
      case "square": return '<rect x="14" y="14" width="36" height="36" rx="3" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="3"/>';
      case "circle": return '<circle cx="32" cy="32" r="19" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="3"/>';
      case "pentagon": return polygon(32, 33, 21, 5, -90, c);
      case "hexagon": return polygon(32, 32, 21, 6, 0, c);
      case "star": return starPath(32, 33, 22, 9, c);
      default: return '<circle cx="32" cy="32" r="18" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="3"/>';
    }
  }

  function solidShape(v, c) {
    switch (v) {
      case "sphere":
        return '<circle cx="32" cy="33" r="19" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="2.5"/>' +
               '<ellipse cx="25" cy="26" rx="7" ry="5" fill="' + c.hi + '" opacity=".5" transform="rotate(-25 25 26)"/>' +
               '<path d="M14 33 a18 7 0 0 0 36 0" fill="none" stroke="' + c.line + '" stroke-width="1.4" opacity=".5"/>';
      case "cylinder":
        return '<path d="M16 18 h32 v26 a16 6 0 0 1 -32 0 z" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="2.5" stroke-linejoin="round"/>' +
               '<ellipse cx="32" cy="18" rx="16" ry="6" fill="' + c.hi + '" opacity=".55" stroke="' + c.line + '" stroke-width="2.5"/>' +
               '<path d="M16 18 v26" stroke="' + c.line + '" stroke-width="2.5"/>' +
               '<path d="M48 18 v26" stroke="' + c.line + '" stroke-width="2.5"/>';
      case "pyramid":
        return '<path d="M32 12 L18 42 L32 48 Z" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="2.5" stroke-linejoin="round"/>' +
               '<path d="M32 12 L46 42 L32 48 Z" fill="' + c.hi + '" opacity=".5" stroke="' + c.line + '" stroke-width="2.5" stroke-linejoin="round"/>' +
               '<path d="M18 42 L46 42 L32 48 Z" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="2.5" stroke-linejoin="round"/>';
      default:
        return '<path d="M32 10 L50 20 L32 30 L14 20 Z" fill="' + c.hi + '" opacity=".6" stroke="' + c.line + '" stroke-width="2.5" stroke-linejoin="round"/>' +
               '<path d="M14 20 L32 30 L32 52 L14 42 Z" fill="' + c.fill + '" stroke="' + c.line + '" stroke-width="2.5" stroke-linejoin="round"/>' +
               '<path d="M32 30 L50 20 L50 42 L32 52 Z" fill="' + c.fill + '" opacity=".8" stroke="' + c.line + '" stroke-width="2.5" stroke-linejoin="round"/>';
    }
  }

  function cardSVG(card) {
    var c = COLORS[card.rarity];
    var inner = card.shape === "dot" ? dotShape(card.variant, c)
              : card.shape === "flat" ? flatShape(card.variant, c)
              : solidShape(card.variant, c);
    return svgWrap(inner);
  }

  /* ------------------------------------------------------------- render */

  function t(key) { return I18N[state.lang][key]; }
  function cardName(card) { return NAME[state.lang][card.id]; }

  function fmtPct(x) {
    var v = Math.round(x * 1000) / 10;
    return (v % 1 === 0 ? v.toFixed(0) : v.toFixed(1)) + "%";
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    function p(n) { return n < 10 ? "0" + n : "" + n; }
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  function renderStatic() {
    document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
    document.getElementById("appTitle").textContent = t("title");
    document.getElementById("appSub").textContent = t("sub");
    document.getElementById("lblPullsLeft").textContent = t("pullsLeft");
    document.getElementById("unitPulls").textContent = t("unitPulls");
    document.getElementById("lblPity").textContent = t("pity");
    document.getElementById("lblRate").textContent = t("rate");
    document.getElementById("lblTotal").textContent = t("total");
    document.getElementById("lblSsrCount").textContent = t("ssrCount");
    document.getElementById("resultTitle").textContent = t("resultTitle");
    document.getElementById("ratesTitle").textContent = t("ratesTitle");
    document.getElementById("ratesNote").textContent = t("ratesNote");
    document.getElementById("historyTitle").textContent = t("historyTitle");
    document.getElementById("helpSummary").textContent = t("helpSummary");
    document.getElementById("helpBody").innerHTML = t("help").join("");
    document.getElementById("footer").textContent = t("footer");
    var p1 = document.getElementById("pull1"), p10 = document.getElementById("pull10");
    p1.querySelector(".t").textContent = t("pull1");
    p10.querySelector(".t").textContent = t("pull10");
    document.getElementById("sim").textContent = t("sim");
    document.getElementById("reset").textContent = t("reset");
    document.getElementById("langEn").setAttribute("aria-pressed", String(state.lang === "en"));
    document.getElementById("langZh").setAttribute("aria-pressed", String(state.lang === "zh"));
  }

  function renderStats() {
    document.getElementById("pullsLeft").textContent = state.left;
    document.getElementById("meterFill").style.width = (state.left / START_PULLS * 100) + "%";
    document.getElementById("pityCount").innerHTML = state.counter + " <small>/ " + HARD_PITY + "</small>";
    document.getElementById("pityFill").style.width = (state.counter / HARD_PITY * 100) + "%";
    document.getElementById("ssrRate").textContent = fmtPct(ssrRate(state.counter));
    document.getElementById("totalPulls").textContent = state.used;
    document.getElementById("ssrCount").textContent = state.stats.SSR;
  }

  function renderButtons() {
    document.getElementById("pull1").disabled = state.left < 1;
    document.getElementById("pull10").disabled = state.left < 10;
    document.getElementById("pull1").querySelector(".cost").textContent = state.left < 1 ? "" : "1";
    document.getElementById("pull10").querySelector(".cost").textContent = state.left < 10 ? "" : "10";
  }

  function renderRates() {
    var groups = [
      { r: "R", pct: 80, each: "13.33", width: 80 },
      { r: "SR", pct: 18, each: "3.0", width: 18 },
      { r: "SSR", pct: 2, each: "0.5", width: 2 }
    ];
    document.getElementById("ratesBody").innerHTML = groups.map(function (g) {
      var names = pool(g.r).map(cardName).join(" · ");
      return '<div class="rate-item">' +
        '<div class="top"><span class="chip ' + g.r + '">' + g.r + "</span>" +
        '<span class="pct">' + g.pct + '%</span>' +
        '<span class="each">' + t("perCard").replace("{p}", g.each) + "</span></div>" +
        '<div class="bar"><i class="' + g.r + '" style="width:' + g.width + '%"></i></div>' +
        '<div class="rate-names">' + names + "</div></div>";
    }).join("");
  }

  function emptyStage() {
    var backs = "";
    for (var i = 0; i < 5; i++) backs += '<div class="ghost-card"><span></span></div>';
    return '<div class="stage-empty"><div class="ghost-row">' + backs +
           '</div><p class="empty">' + t("emptyStage") + "</p></div>";
  }

  function renderResults(cards) {
    var box = document.getElementById("results");
    var meta = document.getElementById("resultMeta");
    var stage = document.querySelector(".stage");
    stage.classList.toggle("compact", !!(cards && cards.length === 1));
    if (!cards || !cards.length) {
      box.innerHTML = emptyStage();
      meta.textContent = "";
      return;
    }
    var best = "R";
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].rarity === "SSR") best = "SSR";
      else if (cards[i].rarity === "SR" && best === "R") best = "SR";
    }
    meta.innerHTML = (cards.length === 1 ? t("metaOne") : t("metaBatch").replace("{n}", cards.length)) +
                     " · " + "<b>" + best + "</b>";
    box.innerHTML = '<div class="grid' + (cards.length === 1 ? " single" : "") + '">' + cards.map(function (c, i) {
      return '<div class="card ' + c.rarity + '" style="animation-delay:' + (i * 45) + 'ms">' +
        '<div class="inner"><span class="rar">' + c.rarity + "</span>" +
        '<div class="art">' + cardSVG(c) + "</div>" +
        '<div class="name">' + cardName(c) + "</div></div></div>";
    }).join("") + "</div>";
  }

  function renderHistory() {
    var box = document.getElementById("history");
    if (!state.history.length) {
      box.innerHTML = '<p class="empty" style="padding:10px 12px">' + t("emptyHistory") + "</p>";
      return;
    }
    box.innerHTML = state.history.map(function (h) {
      var card = null;
      for (var i = 0; i < CARDS.length; i++) if (CARDS[i].id === h.id) card = CARDS[i];
      var nm = card ? cardName(card) : h.id;
      return '<div class="hist-row ' + h.rarity + '">' +
        '<span class="idx">#' + h.n + "</span>" +
        '<span class="chip ' + h.rarity + '">' + h.rarity + "</span>" +
        '<span class="nm">' + nm + '</span><span class="tm">' + fmtTime(h.t) + "</span></div>";
    }).join("");
  }

  function setHint(text, warn) {
    var h = document.getElementById("hint");
    h.textContent = text;
    h.className = warn ? "hint warn" : "hint";
  }

  function renderAll() {
    renderStatic();
    renderStats();
    renderButtons();
    renderRates();
    renderHistory();
  }

  /* ------------------------------------------------------------- actions */

  function pull(n) {
    if (state.left < n) { setHint(t("hintNoPulls"), true); return; }
    state.left -= n;
    var cards = n === 10 ? doPullTen(rngDefault) : [doPull(rngDefault)];
    lastCards = cards;
    commit(cards);
    renderStats();
    renderButtons();
    renderHistory();
    renderResults(cards);
    setHint(state.left === 0 ? t("hintNoPulls") : t("hintPity"), state.left === 0);
  }

  function simulate(n) {
    var counter = 0, r = 0, sr = 0, ssr = 0, ssrPulls = 0, run = 0;
    for (var i = 0; i < n; i++) {
      var res = roll(Math.random, counter);
      counter = res.counter;
      if (res.rarity === "SSR") { ssr++; ssrPulls += run + 1; run = 0; }
      else { run++; if (res.rarity === "SR") sr++; else r++; }
    }
    var avg = ssr ? (ssrPulls / ssr).toFixed(1) : "—";
    setHint(t("hintSim")
      .replace("{n}", String(n))
      .replace("{r}", (r / n * 100).toFixed(1))
      .replace("{sr}", (sr / n * 100).toFixed(1))
      .replace("{ssr}", (ssr / n * 100).toFixed(2))
      .replace("{avg}", avg), false);
  }

  function resetAll() {
    if (!window.confirm(t("confirmReset"))) return;
    var lang = state.lang;
    state = defaultState();
    state.lang = lang;
    save();
    renderAll();
    renderResults([]);
    setHint(t("hintReady"), false);
  }

  function setLang(lang) {
    state.lang = lang;
    save();
    renderStatic();
    renderStats();
    renderRates();
    renderHistory();
    renderResults(lastCards);
  }

  var lastCards = [];

  /* --------------------------------------------------------------- boot */

  function boot() {
    state = load();
    renderAll();
    renderResults([]);
    setHint(t("hintReady"), false);

    document.getElementById("pull1").addEventListener("click", function () { pull(1); });
    document.getElementById("pull10").addEventListener("click", function () { pull(10); });
    document.getElementById("sim").addEventListener("click", function () { simulate(10000); });
    document.getElementById("reset").addEventListener("click", resetAll);
    document.getElementById("langEn").addEventListener("click", function () { setLang("en"); });
    document.getElementById("langZh").addEventListener("click", function () { setLang("zh"); });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
